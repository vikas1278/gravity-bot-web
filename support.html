<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support — Gravity Bot</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVIGATION -->
  <nav>
    <a class="brand" href="/">
      <img id="navLogo" src="assets/logo.png" alt="Gravity Bot">
      <b>GRAVITY BOT</b>
    </a>
    <a class="invite" href="/">Home</a>
  </nav>

  <!-- SUPPORT HERO -->
  <main class="commands-page">
    <div class="pagehero">
      <div class="eyebrow">HELP CENTER</div>
      <h1>Gravity <span>Support.</span></h1>
      <p>Join the support server from the link configured in Admin.</p>
    </div>

    <div class="command-category" style="padding: 30px;">
      <h2>Need help?</h2>
      <p>Use the official support server configured by the administrator.</p>
      <div style="margin-top: 20px;">
        <a class="invite" id="support" href="#" target="_blank">Open Support Server ↗</a>
      </div>
    </div>
  </main>

  <script>
    fetch('/api/public')
      .then(r => r.json())
      .then(d => {
        const link = document.getElementById('support');
        if (link) link.href = d.settings.support_url || '#';
      });
  </script>
</body>
</html>
